<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chart Composer v1</title><link rel="stylesheet" href="/composer.css"><script defer src="/composer.js"></script>
</head>
<body>
  <header class="topbar"><div><p class="eyebrow">MODEL FAMILY</p><h1>Chart Composer v1</h1><p class="note">事件候选与动作槽位的独立训练、生成和检查工作区</p></div><nav><a href="/">主工作台</a><a href="/form-lab">Song Form</a><a class="active" href="/composer">Composer</a></nav></header>
  <main class="shell">
    <section class="column">
      <section class="panel"><div class="heading"><span class="kicker">TRAIN</span><h2>训练 chart_composer_v1</h2></div>
        <form id="trainForm" class="grid">
          <label class="wide">训练 manifest<input name="manifest" required placeholder="E:\\datasets\\composer_manifest.json"></label>
          <label>Checkpoint 输出目录<input name="checkpoint_dir" required placeholder="E:\\runs\\composer_v1"></label><label>音频缓存目录<input name="cache_dir" required placeholder="E:\\cache\\composer"></label>
          <label>模式<select name="mode"><option value="fresh">fresh 从头</option><option value="resume">resume 继续</option><option value="finetune">finetune 初始化</option></select></label><label>resume / init checkpoint<input name="parent" placeholder="非 fresh 模式必填"></label>
          <label>Epochs<input name="epochs" type="number" min="1" value="10"></label><label>Batch size<input name="batch_size" type="number" min="1" value="4"></label>
          <label>学习率<input name="lr" type="number" min="0" step="any" value="0.0002"></label><label>设备<select name="device"><option value="auto">auto</option><option value="cuda">CUDA</option><option value="cpu">CPU</option></select></label>
          <label>精度<select name="precision"><option value="auto">auto</option><option value="fp32">fp32</option><option value="fp16">fp16</option><option value="bf16">bf16</option></select></label><label>随机种子<input name="seed" type="number" min="0" value="0"></label>
          <details class="wide"><summary>模型与准备参数</summary><div class="grid nested"><label>d_model<input name="d_model" type="number" min="1" value="192"></label><label>前馈层宽度<input name="dim_feedforward" type="number" min="1" value="576"></label><label>层数<input name="layers" type="number" min="1" value="3"></label><label>注意力头<input name="nhead" type="number" min="1" value="6"></label><label>历史事件<input name="history_events" type="number" min="1" value="128"></label><label>候选数<input name="candidate_count" type="number" min="1" value="64"></label><label>动作槽位<input name="action_slots" type="number" min="1" value="8"></label><label>保存间隔步数<input name="checkpoint_interval_steps" type="number" min="0" value="500"></label><label>谱面上限<input name="limit_charts" type="number" min="0" value="0"></label><label>准备 workers<input name="prepare_workers" type="number" min="0" value="4"></label><label>音频缓存 GiB<input name="audio_cache_gb" type="number" min="0" step="any" value="4"></label></div></details>
          <button class="primary" type="submit">开始训练</button>
        </form>
      </section>
      <section class="panel"><div class="heading"><span class="kicker">GENERATE</span><h2>生成谱面</h2></div>
        <form id="generateForm" class="grid"><label class="wide">音频路径<input name="audio" required placeholder="D:\\music\\song.mp3"></label><label class="wide">Composer checkpoint<input name="checkpoint" required placeholder="E:\\runs\\composer_v1\\composer_last.pt"></label><label class="wide">输出 .txt<input name="output" required placeholder="E:\\generated\\song.txt"></label><label>BPM（可选）<input name="bpm" type="number" min="0" step="any"></label><label>first<input name="first" type="number" step="any" value="0"></label><label>等级<input name="level" type="number" min="0" step="any" value="13"></label><label>温度<input name="temperature" type="number" min="0" step="any" value="0.8"></label><label>最大事件<input name="max_events" type="number" min="0" value="0"></label><label>设备<select name="device"><option value="auto">auto</option><option value="cuda">CUDA</option><option value="cpu">CPU</option></select></label><label>随机种子<input name="seed" type="number" min="0" value="0"></label><label class="wide">condition JSON（可选）<input name="condition_file" placeholder="E:\\conditions\\song.json"></label><button class="primary" type="submit">开始生成</button></form>
      </section>
      <section class="panel"><div class="heading"><span class="kicker">INSPECT</span><h2>Checkpoint inspection</h2></div><form id="inspectForm" class="inline"><input name="checkpoint" required placeholder="E:\\runs\\composer_v1\\composer_last.pt"><button type="submit">检查</button></form><pre id="inspection">尚未检查</pre></section>
    </section>
    <aside class="panel task"><div class="heading"><h2>任务状态</h2><button id="cancel" type="button" disabled>中断</button></div><div class="status"><strong id="taskKind">待命</strong><span id="taskState">未提交</span></div><p id="taskMessage"></p><div class="track"><i id="progress"></i></div><small id="progressText"></small><h3>产物</h3><div id="artifacts" class="artifacts">完成后显示</div><h3>完整日志</h3><pre id="logs"></pre></aside>
  </main>
</body>
</html>
