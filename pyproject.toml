[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ChroMAI"
version = "1.0.0"
description = "ChroMAI: audio-conditioned maimai chart research framework with Simai generation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ChroMAI contributors" }
]
dependencies = [
  "packaging>=23"
]

[project.urls]
Homepage = "https://github.com/baiqieji233/ChroMAI"
Repository = "https://github.com/baiqieji233/ChroMAI"
Issues = "https://github.com/baiqieji233/ChroMAI/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8"
]
audio = [
  "librosa>=0.10",
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12"
]
training = [
  "torch>=2.0"
]
training-speed = [
  "numba>=0.61"
]
intel-acceleration = [
  "openvino>=2026.0,<2027"
]
composer-v2-music = [
  "librosa>=0.10.2",
  "soxr>=0.3.2",
  "audioread>=2.1.9",
  "torch>=2.4",
  "torchaudio>=2.4",
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "transformers>=4.38,<4.49; python_version < '3.13'",
  "transformers>=4.47,<4.49; python_version >= '3.13'",
  "huggingface_hub>=0.20,<1"
]
music-structure = [
  "beat-this==1.1.0",
  "torchaudio>=2.0",
  "soundfile>=0.12",
  "tqdm>=4.66"
]

[project.scripts]
chromai = "maichart.cli:main"
chromai-webui = "maichart.webui.server:main"
chromai-hand-preview = "maichart.legacy_hands.preview:main"
maichart = "maichart.cli:main"
maichart-train = "maichart.training.train_generator:main"
maichart-generate = "maichart.generation.cli:main"
maichart-gui = "maichart.webui.server:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSE_SCOPE.md", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"maichart.generation.muri" = ["reference/*.gz", "reference/*.json", "reference/*.md"]
"maichart.webui" = ["static/*"]

# Note: the local tests/ suite is excluded from the public repository release.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
