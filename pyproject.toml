[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maimai-ai-chart"
version = "0.2.0"
description = "Audio-conditioned maimai chart research framework with Simai generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "maimai-ai-chart contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8"
]
audio = [
  "librosa>=0.10",
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12"
]
training = [
  "torch>=2.0"
]
training-speed = [
  "numba>=0.61"
]
music-structure = [
  "beat-this==1.1.0",
  "torchaudio>=2.0",
  "soundfile>=0.12",
  "tqdm>=4.66"
]

[project.scripts]
maichart = "maichart.cli:main"
maichart-train = "maichart.training.train_generator:main"
maichart-generate = "maichart.generation.cli:main"
maichart-gui = "maichart.webui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"maichart.generation.muri" = ["reference/*.gz", "reference/*.json", "reference/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
