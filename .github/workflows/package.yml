name: Release package checks

on: [push, pull_request]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: python -m compileall -q src tools
      - name: Build installable distributions
        run: |
          python -m pip install build
          python -m build
      - name: Check installed command entry
        run: |
          python -m pip install dist/*.whl
          python -c "from importlib.metadata import distribution; assert any(e.name == 'maichart-gui' for e in distribution('maimai-ai-chart').entry_points)"
