name: Release package checks

on: [push, pull_request]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: python -m compileall -q src tools
      - name: Check WebUI progress view helper
        run: |
          if command -v node >/dev/null 2>&1; then
            node tools/check_composer_v2_progress.js
          fi
      - name: Build installable distributions
        run: |
          python -m pip install build
          python -m build
      - name: Check installed command entry
        run: |
          python -m pip install dist/*.whl
          python -c "from importlib.metadata import distribution; names = {e.name for e in distribution('ChroMAI').entry_points}; assert {'chromai', 'chromai-webui', 'maichart', 'maichart-gui'}.issubset(names), names"
